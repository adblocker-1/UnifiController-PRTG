name: PowerShell

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  $failed = $true
                  Write-Host "::error file=$($_.Name)::$($errors.Count) Parser-Fehler"
                  $errors | ForEach-Object { Write-Host "  Zeile $($_.Extent.StartLineNumber): $($_.Message)" }
              } else {
                  Write-Host "OK: $($_.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          if ($results) { $results | Format-Table -AutoSize RuleName, Severity, Line, ScriptName, Message }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { exit 1 }
